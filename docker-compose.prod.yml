services:
  backend:
    build:
      target: production
    restart: always
    volumes:
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: production

  frontend:
    build:
      target: production
    restart: always
    volumes:
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: production

  postgres:
    restart: always

  redis:
    restart: always

  prometheus:
    restart: always

  grafana:
    restart: always
